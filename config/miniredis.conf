# MiniRedis17 Configuration

# Network
bind 127.0.0.1
port 6380

# AOF persistence
appendonly yes
appendfilename miniredis.aof
appendfsync always

# Client limits
max-client-input-buffer 67108864
max-client-output-buffer 67108864

# Protocol limits
max-bulk-length 536870912

# Expiration
active-expire-interval-ms 100

# Logging
log-level info
